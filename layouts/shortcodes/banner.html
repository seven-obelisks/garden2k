{{ $image := .Get "image" }}

<div class="page-banner{{ if not $image }} page-banner-no-image{{ end }}" {{ with $image }}style="background-image: url('{{ . }}');"{{ end }}>
  <div class="page-banner-content">
    <h2 class="page-banner-title">{{ .Get "title" }}</h2>

    {{ with .Get "text" }}
      <p class="page-banner-text">{{ . }}</p>
    {{ end }}

    {{ if and (.Get "button_text") (.Get "button_url") }}
      <a href="{{ .Get "button_url" }}" class="page-banner-button">
        {{ .Get "button_text" }}
      </a>
    {{ end }}
  </div>
</div>
